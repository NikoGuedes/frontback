<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de usuários</title>
    <link rel="stylesheet" href="./styles/estilo.css">

</head>
<body> 

<main>
    <header>
        <h1>Gestão de usuarios</h1>
        <p>Cadastre, consulte, atualize e remova usuarios em so lugar.</p>
    </header>

    <section>
        <div>
            <span>Dados do usuario</span>
            <h2>Gerenciar cadastros</h2>
        </div>
        <div>

        <div class="fields">
            <label class="field">
                <span>ID:</span>
                <input type="text" id="id"  placeholder="Ex: 007" autocomplete="off">
            </label>
                
            <label for="field">
                <span>CPF:</span>
                <input type="text" id="cpf" placeholder="cpf" autocomplete="off">
            </label>
            
            <!-- ESTE ABAIXO É NOVO -->
            <label for="field">
                <span>Email:</span>
                <input type="text" id="email" placeholder="Email" autocomplete="off">
            </label>
        </div>

        <div class= action>
            <button class="primary" type="button" onclick ="criar()">Criar Usuário</button>
            <button class="secondary" type="button" onclick ="buscarTodos()">Buscar Todos</button>
            <button class="secondary" type="button" onclick ="alterar()">Alterar</button>
            <button class="danger" type="button" onclick ="deletar()">Deletar</button>
        </div>
        
        <p class = "feedback" id="resultado"></p>

    </section>

    <section>
        <div>
            <span>CADASTRADOS</span>
            <h2>Lista de usuários</h2>
        </div><h1>re</h1>
        <ul id="listaUsuarios"></ul>
    </section>
    
</main>

     <script src = "scripts/index.js"></script>
     
</body>
</html>
